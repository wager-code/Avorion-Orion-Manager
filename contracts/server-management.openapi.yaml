openapi: 3.1.0
info:
  title: Avorion Web 管理中心 - 服务器管理 API
  version: 0.13.0
  description: >-
    服务器管理八个已确认页面的真实数据合同。任何不可取得的数据必须返回 null、unknown
    或明确错误，不允许使用前端默认值冒充真实结果。
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Security
  - name: Servers
  - name: Control
  - name: Players
  - name: Alliances
  - name: GameManagement
  - name: Performance
  - name: Memory
  - name: Updates
  - name: FileSystem
  - name: Tasks
  - name: Backups
  - name: Logs
  - name: Diagnostics
  - name: Operations
paths:
  /session/local:
    post:
      tags: [Security]
      operationId: createLocalAdminSession
      security: []
      description: 仅允许从 Server Agent 本机建立短期管理员会话，设置 HttpOnly、SameSite=Strict Cookie。
      responses:
        "200":
          description: 本机管理员会话与写操作防伪令牌
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminSessionStatus"}
        default: {$ref: "#/components/responses/Error"}
  /session:
    get:
      tags: [Security]
      operationId: getAdminSession
      security: []
      responses:
        "200":
          description: 当前浏览器会话状态；响应禁止缓存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminSessionStatus"}
    delete:
      tags: [Security]
      operationId: revokeAdminSession
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      responses:
        "204": {description: 会话已撤销}
        default: {$ref: "#/components/responses/Error"}
  /security/write-safety:
    get:
      tags: [Security]
      operationId: getWriteSafetyStatus
      security: []
      responses:
        "200":
          description: 默认拒绝策略及固定命令允许清单的当前验证状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WriteSafetyStatus"}
  /health:
    get:
      tags: [Security]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Server Agent 进程健康状态；不代表游戏服务端正在运行
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /servers:
    get:
      tags: [Servers]
      operationId: listServers
      responses:
        "200":
          description: 可访问的服务器列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ServerSummary"}
  /servers/{serverId}/status:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [Servers]
      operationId: getServerStatus
      responses:
        "200":
          description: 真实服务器状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerStatus"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/actions/start:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Control]
      operationId: startServer
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/events:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    get:
      tags: [Control]
      operationId: listServerEvents
      responses:
        "200":
          description: 控制页最近真实事件
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ServerEvent"}}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/actions/save:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Control]
      operationId: saveWorld
      x-implementation-gate: target-version-command-verification-required
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/inventory-catalog:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: query
        in: query
        schema: {type: string, maxLength: 128}
      - name: itemType
        in: query
        schema: {type: string, enum: [turret, system-upgrade]}
      - name: grantPolicy
        in: query
        schema: {type: string, enum: [verified-grantable, catalog-only, story-blocked]}
      - name: offset
        in: query
        schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 100}
    get:
      tags: [GameManagement]
      operationId: listInventoryCatalog
      description: 搜索本机索引的原版炮塔与系统插件目录；目录条目不等于可发放能力。
      responses:
        "200":
          description: 物品目录分页
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InventoryCatalogPage"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/inventory-icons:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: path
        in: query
        required: true
        description: 仅允许 data/textures/icons/ 下的规范化相对路径
        schema: {type: string, minLength: 1, maxLength: 256}
    get:
      tags: [GameManagement]
      operationId: getInventoryIcon
      responses:
        "200":
          description: 游戏客户端资源中的图标；带 private,max-age=3600 与 ETag
          headers:
            ETag:
              schema: {type: string}
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/management-bridge/status:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [Updates]
      operationId: getManagementBridgeInstallationStatus
      description: 读取随包与 Galaxy 中 OrionAdminBridge 的版本、文件一致性和 modconfig.lua 启用状态；不修改文件。
      responses:
        "200":
          description: 管理组件安装状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagementBridgeStatus"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/management-bridge/hello:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [GameManagement]
      operationId: getManagementBridgeCapabilities
      description: 读取当前 OrionAdminBridge 协议版本与服务端能力清单。
      responses:
        "200":
          description: 管理组件能力
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BridgeHelloEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/management-bridge/players:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: offset
        in: query
        schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 10, default: 10}
    get:
      tags: [Players]
      operationId: listOnlinePlayers
      description: 通过 OrionAdminBridge 读取当前在线玩家与可用星区位置。
      responses:
        "200":
          description: 在线玩家分页
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlayerQueryEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/management-bridge/alliances:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: offset
        in: query
        schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 10, default: 10}
    get:
      tags: [Alliances]
      operationId: listAlliances
      description: 通过 OrionAdminBridge 读取真实联盟摘要与聚合统计。
      responses:
        "200":
          description: 联盟分页
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AllianceQueryEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/management-bridge/alliance:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: index
        in: query
        required: true
        schema: {type: integer, minimum: 1, maximum: 100000}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 20, default: 20}
    get:
      tags: [Alliances]
      operationId: getAllianceDetails
      description: 通过 OrionAdminBridge 读取指定联盟摘要与最多 20 名成员。
      responses:
        "200":
          description: 联盟详情
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AllianceDetailEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/management-bridge/players-known:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: offset
        in: query
        schema: {type: integer, minimum: 0, default: 0}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 50, default: 10}
    get:
      tags: [Players]
      operationId: listKnownPlayerIdentities
      description: 通过 OrionAdminBridge 读取 Galaxy 已知玩家的名称和索引；不返回在线状态、位置或资产。
      responses:
        "200":
          description: 已知玩家最小身份分页
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KnownPlayerQueryEnvelope"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/players/{playerIndex}/assets:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: playerIndex
        in: path
        required: true
        schema: {type: integer, minimum: 1, maximum: 100000}
    get:
      tags: [Players]
      operationId: getPlayerAssets
      description: 通过 OrionAdminBridge 读取指定真实玩家的 Credits 与七种资源；不修改资产。
      responses:
        "200":
          description: 玩家实时资产
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlayerAssetsSnapshot"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/players/{playerIndex}/reward-grants:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: playerIndex
        in: path
        required: true
        schema: {type: integer, minimum: 1, maximum: 100000}
    post:
      tags: [Players]
      operationId: grantPlayerReward
      x-risk: high
      description: 通过固定 OrionAdminBridge 动作向单个玩家增加 Credits 或七种矿物；持久化幂等操作并返回精确变更前后资产。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlayerRewardRequest"}
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/players/{playerIndex}/inventory:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: playerIndex
        in: path
        required: true
        schema: {type: integer, minimum: 1, maximum: 100000}
      - {$ref: "#/components/parameters/InventoryOffset"}
      - {$ref: "#/components/parameters/InventoryLimit"}
    get:
      tags: [Players]
      operationId: getPlayerInventory
      description: 读取指定玩家的真实 Inventory 分页；不会修改物品。
      responses:
        "200":
          description: 玩家实时库存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InventorySnapshot"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/players/{playerIndex}/system-upgrade-grants:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: playerIndex
        in: path
        required: true
        schema: {type: integer, minimum: 1, maximum: 100000}
    post:
      tags: [Players]
      operationId: grantPlayerSystemUpgrade
      x-risk: high
      description: 向指定玩家 Inventory 加入一个固定白名单原版系统插件；持久化操作并复核请求 Seed、游戏实际 Seed 与精确 +1 增量。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SystemUpgradeGrantRequest"}
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/reward-batches:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [GameManagement]
      operationId: listRewardBatches
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 30, default: 10}
      responses:
        "200":
          description: 最近持久化奖励批次 Operation
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Operation"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [GameManagement]
      operationId: createRewardBatch
      x-risk: high
      description: 为 1–50 名玩家创建游戏内邮件或直接到账批次；父批次和逐目标操作均持久化，失败目标不自动重试。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RewardBatchRequest"}
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/alliances/{allianceIndex}/assets:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: allianceIndex
        in: path
        required: true
        schema: {type: integer, minimum: 1, maximum: 100000}
    get:
      tags: [Alliances]
      operationId: getAllianceAssets
      description: 通过 OrionAdminBridge 读取指定真实联盟的 Credits 与七种资源；不修改资产。
      responses:
        "200":
          description: 联盟实时资产
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AllianceAssetsSnapshot"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/alliances/{allianceIndex}/reward-grants:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: allianceIndex
        in: path
        required: true
        schema: {type: integer, minimum: 1, maximum: 100000}
    post:
      tags: [Alliances]
      operationId: grantAllianceReward
      x-risk: high
      description: 通过固定 OrionAdminBridge 动作向单个联盟增加 Credits 或七种矿物；持久化幂等操作并返回精确变更前后资产。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AllianceRewardRequest"}
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/alliances/{allianceIndex}/inventory:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: allianceIndex
        in: path
        required: true
        schema: {type: integer, minimum: 1, maximum: 100000}
      - {$ref: "#/components/parameters/InventoryOffset"}
      - {$ref: "#/components/parameters/InventoryLimit"}
    get:
      tags: [Alliances]
      operationId: getAllianceInventory
      description: 读取指定联盟的真实 Inventory 分页；不会修改物品。
      responses:
        "200":
          description: 联盟实时库存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InventorySnapshot"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/alliances/{allianceIndex}/system-upgrade-grants:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: allianceIndex
        in: path
        required: true
        schema: {type: integer, minimum: 1, maximum: 100000}
    post:
      tags: [Alliances]
      operationId: grantAllianceSystemUpgrade
      x-risk: high
      description: 向指定联盟 Inventory 加入一个固定白名单原版系统插件；持久化操作并复核请求 Seed、游戏实际 Seed 与精确 +1 增量。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SystemUpgradeGrantRequest"}
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/actions/shutdown:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Control]
      operationId: shutdownServer
      x-risk: high
      x-implementation-gate: target-version-command-verification-required
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/actions/restart:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Control]
      operationId: restartServer
      x-risk: high
      x-implementation-gate: target-version-command-verification-required
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/actions/force-stop:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Control]
      operationId: forceStopServer
      x-risk: critical
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation, reason]
              properties:
                confirmation: {type: string, const: FORCE_STOP}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/performance/current:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [Performance]
      operationId: getCurrentPerformance
      responses:
        "200":
          description: 当前真实性能指标
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PerformanceSnapshot"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/performance/history:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: range
        in: query
        required: true
        schema: {type: string, enum: [1h, 24h, 7d]}
    get:
      tags: [Performance]
      operationId: getPerformanceHistory
      responses:
        "200":
          description: SQLite 中的真实历史采样
          content:
            application/json:
              schema:
                type: object
                required: [range, points]
                properties:
                  range: {type: string, enum: [1h, 24h, 7d]}
                  points:
                    type: array
                    items: {$ref: "#/components/schemas/PerformancePoint"}
                  warningCode: {type: [string, "null"], enum: [INSUFFICIENT_HISTORY, null]}
  /servers/{serverId}/memory:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [Memory]
      operationId: getMemoryOverview
      responses:
        "200":
          description: 内存和星区摘要
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryOverview"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/sectors:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: filter
        in: query
        schema: {type: string, enum: [all, players, idle, eligible], default: all}
      - name: sort
        in: query
        schema: {type: string, enum: [loaded, idle, memory], default: loaded}
    get:
      tags: [Memory]
      operationId: listLoadedSectors
      responses:
        "200":
          description: 当前无非侵入式可靠数据源；返回不可用状态，不植入自定义 MOD
          content:
            application/json:
              schema:
                type: object
                required: [items, provenance]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SectorRecord"}}
                  provenance: {$ref: "#/components/schemas/Provenance"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/sectors/unload-attempts:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Memory]
      operationId: tryUnloadSectors
      x-verified-avorion-api: Galaxy.tryUnloadSector(x,y)
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sectors]
              properties:
                sectors:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: {$ref: "#/components/schemas/SectorCoordinate"}
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/memory-policy:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [Memory]
      operationId: getMemoryPolicy
      responses:
        "200":
          description: 当前持久化内存策略
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryPolicy"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [Memory]
      operationId: updateMemoryPolicy
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemoryPolicyInput"}
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryPolicy"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/updates/status:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [Updates]
      operationId: getUpdateStatus
      responses:
        "200":
          description: SteamCMD 与版本状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateStatus"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/filesystem/directories:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: path
        in: query
        required: false
        description: 服务器上的绝对目录；省略时列出可用本地磁盘
        schema: {type: string}
    get:
      tags: [FileSystem]
      operationId: browseServerDirectories
      description: 只读列出 Server Agent 所在服务器的磁盘或指定目录的直接子目录。
      responses:
        "200":
          description: 真实服务器目录列表
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileSystemBrowseResult"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/update-environment:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [Updates]
      operationId: getUpdateEnvironment
      responses:
        "200":
          description: 已保存路径及其当前真实验证结果
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateEnvironmentCurrent"}
        default: {$ref: "#/components/responses/Error"}
    put:
      tags: [Updates]
      operationId: validateAndSaveUpdateEnvironment
      description: 验证真实文件后，仅把通过验证的路径保存到本机管理数据库；不执行 SteamCMD。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateEnvironmentRequest"}
      responses:
        "200":
          description: 验证通过并已保存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateEnvironmentValidation"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/server-setup/draft:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [Updates]
      operationId: getServerSetupDraft
      description: 读取保存在本机管理数据库中的非敏感服务器配置草稿。响应永远不包含 RCON 密码。
      responses:
        "200":
          description: 当前草稿；尚未保存时 draft 为 null
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerSetupDraftCurrent"}
        default: {$ref: "#/components/responses/Error"}
    put:
      tags: [Updates]
      operationId: saveServerSetupDraft
      description: 只保存非敏感草稿，不写游戏配置、不启动服务器，也不修改防火墙或 MOD。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ServerSetupDraftInput"}
      responses:
        "200":
          description: 已保存的非敏感草稿
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerSetupDraftConfiguration"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/server-setup/preflight:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Updates]
      operationId: preflightServerSetup
      description: >-
        真实检查已保存更新环境、Galaxy 路径、字段及本机 TCP/UDP 端口占用。
        RCON 密码只在本次请求内存中参与验证，不持久化、不记录且不回传。
        本接口不写 server.ini、不启动服务器、不修改防火墙，也不安装 MOD。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ServerSetupPreflightInput"}
      responses:
        "200":
          description: 真实预检结果；是否通过由 valid 字段表示
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerSetupPreflightResult"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/server-setup/applications:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Updates]
      operationId: applyServerSetup
      description: >-
        在重新通过真实预检且精确 AvorionServer.exe 未运行后，创建 server.configure Operation。
        始终原子写入不含秘密的受控启动档案；只有已有 Galaxy 的 server.ini 存在且结构无歧义时，
        才原子更新已验证的 Networking.port/rconIp/rconPassword/rconPort 与
        Administration.maxPlayers/name。新 Galaxy 不伪造 server.ini，RCON 延后到首次初始化后。
        游戏监听地址、独立 Query 端口和防火墙均不在本接口中执行；仅在明确选择时安装并校验随包 OrionAdminBridge。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ServerSetupPreflightInput"}
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/server-setup/initializations:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Updates]
      operationId: initializeNewGalaxy
      description: >-
        仅用于启用 RCON 的全新 Galaxy。重新预检并核验受控启动档案后启动精确
        AvorionServer.exe，等待服务端自行生成 server.ini，依次发送 /save 与 /stop
        并确认安全退出。停服后原子写入 RCON，再重启并要求真实 RCON 认证成功。
        RCON 密码只存在于本次请求/工作内存和 Avorion 必需的 server.ini；不得写入
        草稿、Operation 证据、日志或响应。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ServerSetupPreflightInput"}
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/update-environment/detection:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [Updates]
      operationId: detectUpdateEnvironment
      description: 只扫描已配置位置、常用安装目录和已知 Steam 库，不递归扫描整块磁盘。
      responses:
        "200":
          description: 真实检测结果
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateEnvironmentDetection"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/installations/steamcmd:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Updates]
      operationId: installSteamCmd
      description: >-
        只安装 SteamCMD 引导程序。固定从 Valve 官方 HTTPS CDN 下载，验证 ZIP 边界、
        SHA-256、Windows PE 与 Valve Authenticode 签名后原子落盘；不运行 steamcmd.exe，
        不安装 Avorion 服务端，不覆盖已有目标目录。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SteamCmdInstallRequest"}
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/installations/avorion-server:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Updates]
      operationId: installAvorionServer
      description: >-
        使用经过 Valve Authenticode 验证的本地 steamcmd.exe，以固定匿名登录、App 565060、
        public 分支和 validate 参数安装 Avorion Dedicated Server。命令不经过 Shell；下载到
        同父目录暂存位置，只有 SteamCMD 成功标记、bin/AvorionServer.exe 和
        bin/ServerRunner.exe 同时验证通过后才原子落盘。不会启动服务端或修改防火墙。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AvorionServerInstallRequest"}
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/update-environment/validation:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Updates]
      operationId: validateUpdateEnvironment
      description: 只读验证路径，不保存配置，不执行更新。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateEnvironmentRequest"}
      responses:
        "200":
          description: 真实验证结果，是否通过由 valid 字段表示
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateEnvironmentValidation"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/updates/checks:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Updates]
      operationId: checkForServerUpdate
      description: 验证 SteamCMD Valve 签名后，以固定匿名参数查询 App 565060 public Build ID；不会调用 app_update 或修改服务端文件。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/updates/verifications:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Updates]
      operationId: verifyServerFiles
      description: 只读检查 AvorionServer.exe 与 ServerRunner.exe 的 PE 文件头、大小和 SHA-256；不会下载、修复或覆盖文件。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/updates/rollback-points/latest:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [Updates]
      operationId: getLatestUpdateRollbackPoint
      description: 只返回清单与清单哈希均验证通过、且属于当前更新环境的最新安全点。
      responses:
        "200":
          description: 最新有效更新安全点；不存在时 available 为 false
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateRollbackPointAvailability"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/updates/rollback-points:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Updates]
      operationId: createUpdateRollbackPoint
      x-risk: high
      description: 停服后复制并逐文件校验服务端与 Galaxy，原子发布安全点；不执行更新、不恢复文件。
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/updates:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Updates]
      operationId: updateServer
      x-risk: high
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/tasks:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [Tasks]
      operationId: listTasks
      responses:
        "200":
          description: 持久化任务列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AutomationTask"}}
    post:
      tags: [Tasks]
      operationId: createTask
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AutomationTaskInput"}
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AutomationTask"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/tasks/{taskId}:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: taskId
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Tasks]
      operationId: updateTask
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AutomationTaskInput"}
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AutomationTask"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/backups:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: cursor
        in: query
        schema: {type: string}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    get:
      tags: [Backups]
      operationId: listBackups
      responses:
        "200":
          description: 从白名单目录扫描到的真实备份文件
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/BackupRecord"}}
                  nextCursor: {type: [string, "null"]}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [Backups]
      operationId: createBackup
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/backups/refresh:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Backups]
      operationId: refreshBackups
      parameters: [{$ref: "#/components/parameters/CsrfToken"}]
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/backups/{backupId}/restore:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: backupId
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [Backups]
      operationId: restoreBackup
      x-risk: critical
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: {type: string, const: RESTORE_BACKUP}
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/logs:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: cursor
        in: query
        schema: {type: string}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 500, default: 200}
      - name: category
        in: query
        schema: {$ref: "#/components/schemas/LogCategory"}
      - name: query
        in: query
        schema: {type: string, maxLength: 200}
    get:
      tags: [Logs]
      operationId: listLogs
      responses:
        "200":
          description: 真实日志记录
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/LogEntry"}}
                  nextCursor: {type: [string, "null"]}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/logs/stream:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    get:
      tags: [Logs]
      operationId: streamLogs
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string}
      responses:
        "200":
          description: SSE 日志流
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/diagnostics/runs:
    parameters: [{$ref: "#/components/parameters/ServerId"}]
    post:
      tags: [Diagnostics]
      operationId: runDiagnostics
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "202": {$ref: "#/components/responses/OperationAccepted"}
        default: {$ref: "#/components/responses/Error"}
  /servers/{serverId}/diagnostics/runs/{runId}:
    parameters:
      - {$ref: "#/components/parameters/ServerId"}
      - name: runId
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Diagnostics]
      operationId: getDiagnosticRun
      responses:
        "200":
          description: 诊断结果
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DiagnosticRun"}
        default: {$ref: "#/components/responses/Error"}
  /operations:
    get:
      tags: [Operations]
      operationId: listOperations
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        "200":
          description: 最近持久化操作
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Operation"}}
  /operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Operations]
      operationId: getOperation
      responses:
        "200":
          description: 长操作状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Operation"}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: avorion_admin_session
  parameters:
    ServerId:
      name: serverId
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 80}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    InventoryOffset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
    InventoryLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 50, default: 50}
  responses:
    Error:
      description: 统一错误
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    OperationAccepted:
      description: 已接受长操作
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OperationAccepted"}
  schemas:
    HealthStatus:
      type: object
      required: [status, mode, sampledAt]
      properties:
        status: {type: string, const: ok}
        mode: {type: string, const: r2-write-safety-locked}
        sampledAt: {type: string, format: date-time}
    AdminSessionStatus:
      type: object
      required: [authenticated, mode]
      properties:
        authenticated: {type: boolean}
        mode: {type: string, const: local-loopback}
        csrfToken: {type: [string, "null"]}
        expiresAt: {type: [string, "null"], format: date-time}
    CommandSafetyStatus:
      type: object
      required: [command, verified, reason]
      properties:
        command: {type: string}
        verified: {type: boolean}
        reason: {type: string}
    WriteSafetyStatus:
      type: object
      required: [defaultPolicy, localSessionRequired, csrfRequired, idempotencyRequired, commands]
      properties:
        defaultPolicy: {type: string, const: deny-by-default}
        localSessionRequired: {type: boolean}
        csrfRequired: {type: boolean}
        idempotencyRequired: {type: boolean}
        commands:
          type: array
          items: {$ref: "#/components/schemas/CommandSafetyStatus"}
    Provenance:
      type: object
      required: [sampledAt, source, freshness]
      properties:
        sampledAt: {type: string, format: date-time}
        source:
          type: string
          enum: [windows, filesystem, steamcmd, steam-query, rcon, database]
        freshness: {type: string, enum: [live, recent, stale, unavailable]}
        unavailableReason: {type: [string, "null"]}
    ServerSummary:
      type: object
      required: [serverId, name, lifecycle, agentConnected]
      properties:
        serverId: {type: string}
        name: {type: string}
        lifecycle: {$ref: "#/components/schemas/Lifecycle"}
        agentConnected: {type: boolean}
    Lifecycle:
      type: string
      enum: [running, stopped, starting, stopping, restarting, unknown]
    ConnectionStatus:
      type: string
      enum: [connected, disconnected, degraded, unknown]
    ServerStatus:
      type: object
      required: [serverId, name, lifecycle, agent, provenance]
      properties:
        serverId: {type: string}
        name: {type: string}
        lifecycle: {$ref: "#/components/schemas/Lifecycle"}
        processId: {type: [integer, "null"]}
        version: {type: [string, "null"]}
        galaxyName: {type: [string, "null"]}
        uptimeSeconds: {type: [integer, "null"], minimum: 0}
        onlinePlayers: {type: [integer, "null"], minimum: 0}
        maxPlayers: {type: [integer, "null"], minimum: 0}
        rcon:
          type: object
          required: [status]
          properties:
            status: {$ref: "#/components/schemas/ConnectionStatus"}
        steamQuery:
          type: object
          required: [status]
          properties:
            status: {$ref: "#/components/schemas/ConnectionStatus"}
            latencyMs: {type: [number, "null"], minimum: 0}
        lastSave:
          type: object
          properties:
            at: {type: [string, "null"], format: date-time}
            source: {type: [string, "null"], enum: [filesystem, rcon, null]}
        agent:
          type: object
          required: [connected]
          properties:
            connected: {type: boolean}
            lastHeartbeatAt: {type: [string, "null"], format: date-time}
        provenance: {$ref: "#/components/schemas/Provenance"}
    ServerEvent:
      type: object
      required: [eventId, occurredAt, kind, message, source]
      properties:
        eventId: {type: string}
        occurredAt: {type: string, format: date-time}
        kind: {type: string, enum: [player, save, rcon, warning, operation, other]}
        message: {type: string}
        source: {type: string, enum: [filesystem, rcon, database]}
    PlayerResourceBalances:
      type: object
      required: [iron, titanium, naonite, trinium, xanion, ogonite, avorion]
      properties:
        iron: {type: integer, minimum: 0, maximum: 9007199254740991}
        titanium: {type: integer, minimum: 0, maximum: 9007199254740991}
