name: Temporary ManagementBridge splitter

on:
  push:
    branches:
      - cleanup/management-bridge-2026-09-15

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/management-bridge-2026-09-15
          fetch-depth: 0

      - name: Split bridge protocol from server-control bridge methods
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/src/AvorionAdmin.Agent/ManagementBridge.cs")
          protocol_path = path.with_name("ManagementBridgeProtocol.cs")
          service_path = path.with_name("ManagedServerControlService.ManagementBridge.cs")

          if not path.exists():
              if protocol_path.exists() and service_path.exists():
                  print("ManagementBridge is already split; nothing to do.")
                  raise SystemExit(0)
              raise RuntimeError("ManagementBridge.cs not found")

          text = path.read_text(encoding="utf-8")
          protocol_marker = "public static class ManagementBridgeProtocol"
          service_marker = "public sealed partial class ManagedServerControlService"
          protocol_start = text.index(protocol_marker)
          service_start = text.index(service_marker, protocol_start)

          preamble = text[:protocol_start]
          protocol_block = text[protocol_start:service_start]
          service_block = text[service_start:]

          if preamble + protocol_block + service_block != text:
              raise RuntimeError("Top-level bridge blocks changed while splitting")
          if "public static JsonElement Parse(" not in protocol_block:
              raise RuntimeError("Protocol parser not found in protocol block")
          if "QueryManagementBridgeAsync" not in service_block or "TryUnloadSectorAsync" not in service_block:
              raise RuntimeError("Expected server-control bridge methods not found")

          protocol_path.write_text(preamble + protocol_block, encoding="utf-8")
          service_path.write_text(preamble + service_block, encoding="utf-8")
          path.unlink()

          print("Split ManagementBridge into protocol validation and ManagedServerControlService bridge methods without rewriting either block.")

      - name: Commit bridge split
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backend/src/AvorionAdmin.Agent/ManagementBridge.cs \
            backend/src/AvorionAdmin.Agent/ManagementBridgeProtocol.cs \
            backend/src/AvorionAdmin.Agent/ManagedServerControlService.ManagementBridge.cs
          git commit -m "M0-10: split ManagementBridge protocol and service responsibilities"
          git push origin HEAD:cleanup/management-bridge-2026-09-15
