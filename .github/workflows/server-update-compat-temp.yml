name: Temporary server update compatibility cleanup

on:
  push:
    branches:
      - cleanup/server-update-compat-2026-09-15

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/server-update-compat-2026-09-15
          fetch-depth: 0

      - name: Remove compatibility wrapper and duplicate error helper
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("frontend-prototype/src/features/server-update/InstallationPathViews.tsx"): [
                  ('import { apiFetch, createIdempotencyKey } from "./serverUpdateApi";', 'import { apiFetch, createIdempotencyKey } from "../../lib/api";'),
                  ('import { isAvorionServerInstallationResult, isSteamCmdInstallationResult } from "./utils";', 'import { isAvorionServerInstallationResult, isSteamCmdInstallationResult, readApiError } from "./utils";'),
              ],
              Path("frontend-prototype/src/features/server-update/SetupWizardView.tsx"): [
                  ('import { apiFetch, createIdempotencyKey } from "./serverUpdateApi";', 'import { apiFetch, createIdempotencyKey } from "../../lib/api";'),
              ],
              Path("frontend-prototype/src/features/server-update/UpdateManagementView.tsx"): [
                  ('import { apiFetch, createIdempotencyKey } from "./serverUpdateApi";', 'import { apiFetch, createIdempotencyKey } from "../../lib/api";'),
              ],
              Path("frontend-prototype/src/pages/ServerUpdatePage.tsx"): [
                  ('import { apiFetch } from "../features/server-update/serverUpdateApi";', 'import { apiFetch } from "../lib/api";'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise RuntimeError(f"Expected import not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          installation = Path("frontend-prototype/src/features/server-update/InstallationPathViews.tsx")
          text = installation.read_text(encoding="utf-8")
          duplicate = '''async function readApiError(response: Response) {\n  const body = await response.json().catch(() => null) as { error?: { message?: string } } | null;\n  return body?.error?.message || `请求失败（HTTP ${response.status}）`;\n}\n\n'''
          if duplicate not in text:
              raise RuntimeError("Duplicate readApiError helper not found")
          installation.write_text(text.replace(duplicate, "", 1), encoding="utf-8")

          wrapper = Path("frontend-prototype/src/features/server-update/serverUpdateApi.ts")
          if wrapper.read_text(encoding="utf-8").strip() != 'export { apiFetch, createIdempotencyKey } from "../../lib/api";':
              raise RuntimeError("serverUpdateApi.ts is no longer a pure compatibility wrapper")
          wrapper.unlink()

          offenders = []
          for path in Path("frontend-prototype/src").rglob("*.ts*"):
              if "serverUpdateApi" in path.read_text(encoding="utf-8"):
                  offenders.append(str(path))
          if offenders:
              raise RuntimeError(f"Compatibility wrapper still referenced: {offenders}")

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend-prototype/src
          git commit -m "M0: remove server update compatibility wrapper"
          git push origin HEAD:cleanup/server-update-compat-2026-09-15
