name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-prototype/pnpm-lock.yaml

      - name: Architecture boundaries
        shell: pwsh
        run: ./tools/check-architecture.ps1

      - name: Build backend
        shell: pwsh
        run: dotnet build ./backend/AvorionAdmin.sln -c Release

      - name: Run backend verification suite
        shell: pwsh
        run: dotnet run --project ./backend/tests/AvorionAdmin.Tests/AvorionAdmin.Tests.csproj -c Release

      - name: Install frontend dependencies
        working-directory: frontend-prototype
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: frontend-prototype
        shell: pwsh
        run: pnpm typecheck

      - name: Build frontend
        working-directory: frontend-prototype
        shell: pwsh
        run: pnpm build

      - name: Test Sites wrapper
        working-directory: frontend-prototype
        shell: pwsh
        run: pnpm test:sites
